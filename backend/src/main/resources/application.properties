spring.application.name=red-solidaria-api

# La base de datos debe existir previamente. Las credenciales se proporcionan
# mediante variables de entorno; no se incluyen valores predeterminados.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/red_solidaria}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway es la única fuente para evolucionar el esquema; Hibernate no lo crea.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
