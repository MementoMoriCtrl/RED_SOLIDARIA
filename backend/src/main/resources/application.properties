spring.application.name=red-solidaria-api

# La base de datos debe existir previamente. Las credenciales se proporcionan
# mediante variables de entorno; no se incluyen valores predeterminados.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway es la única fuente para evolucionar el esquema; Hibernate no lo crea.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
