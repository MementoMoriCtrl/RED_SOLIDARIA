<main class="app-layout">
  <aside class="sidebar" aria-label="Navegación principal">
    <a class="brand" routerLink="/" aria-label="Red Solidaria, inicio">
      <span class="brand-mark" aria-hidden="true">RS</span>
      <span class="brand-copy"><strong>Red Solidaria</strong><small>Gestión y trazabilidad</small></span>
    </a>
    <p class="sidebar-label">MÓDULOS</p>
    <nav class="side-nav" aria-label="Módulos disponibles">
      @if (showAdminLink) {
        <a class="nav-item" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
          <span class="nav-icon" aria-hidden="true">A</span><span>Panel administrativo</span>
        </a>
        <a class="nav-item" routerLink="/admin/donaciones" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" ariaCurrentWhenActive="page">
          <span class="nav-icon" aria-hidden="true">D</span><span>Gestión de donaciones</span>
        </a>
      }
      @if (showResourceLink) {
        <a class="nav-item" routerLink="/recursos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
          <span class="nav-icon" aria-hidden="true">R</span><span>Gestión de recursos</span>
        </a>
      }
      <a class="nav-item" routerLink="/trazabilidad" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <span class="nav-icon" aria-hidden="true">T</span><span>Trazabilidad pública</span>
      </a>
    </nav>
    <div class="sidebar-footer">{{ footerText }}<br />Red Solidaria</div>
  </aside>

  <div class="page-shell">
    <header class="page-header">
      <span class="breadcrumb">{{ breadcrumb }}</span>
      <ng-content select="[shell-actions]" />
    </header>
    <ng-content />
  </div>
</main>
